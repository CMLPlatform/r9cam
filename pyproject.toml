[build-system]
  build-backend = "uv_build"
  requires      = ["uv_build>=0.13.5,<0.14"]

[tool.uv.build-backend]
  module-name = "app"
  module-root = "."

[project]
  authors = [{ name = "Simon van Lierde", email = "s.n.van.lierde@cml.leidenuniv.nl" }]
  classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: Capture",
    "Topic :: Multimedia :: Video :: Capture",
    "Topic :: System :: Hardware",
  ]
  # Project metadata
  description = "Raspberry Pi Camera plugin for R9lab platform"
  license       = "AGPL-3.0-or-later"
  license-files = ["LICENSE"]
  maintainers = [{ name = "Simon van Lierde", email = "s.n.van.lierde@cml.leidenuniv.nl" }]
  name        = "r9cam"

  # Dependencies and version constraints
  dependencies = [
    "fastapi[standard]>=0.115.8",
    "opentelemetry-exporter-otlp-proto-http>=1.38.0",
    "opentelemetry-instrumentation-fastapi>=0.59b0",
    "opentelemetry-instrumentation-httpx>=0.59b0",
    "opentelemetry-sdk>=1.38.0",
    "pillow>=10.0.0",
    "psutil>=5.9",
    "pydantic-settings>=2.8.0",
    "pyjwt[crypto]>=2.12.1",
    "r9cam-models>=0.6.0,<0.7",                 # NOTE: Keep this aligned with the published contract package
    "websockets>=16.0",
  ]

  requires-python = ">=3.13,<3.14" # Python 3.13 is needed in Debian Trixie for picamera2
  version         = "0.6.2"        # NOTE: set by `just release-prep`

  [project.urls]
    Homepage   = "https://github.com/CMLPlatform/r9cam"
    Issues     = "https://github.com/CMLPlatform/r9cam/issues"
    Repository = "https://github.com/CMLPlatform/r9cam.git"

[dependency-groups]
  dev = [
    { include-group = "test" },
    { include-group = "s3" },
    "commitizen>=4.8.3",
    "mutmut==3.8.0",
    "prek>=0.4.11",
    "ruff>=0.9.6",
    "ty>=0.0.29",
  ]
  # Kept out of dev: atheris ships Linux x86_64 wheels only. ClusterFuzzLite bundles
  # the harness with pyinstaller.
  fuzz = ["atheris>=3.1.0", "pyinstaller>=6.11"]
  test = ["hypothesis>=6.170.2", "pytest>=8.0", "pytest-asyncio>=0.25", "pytest-codspeed>=5.0.3", "pytest-cov>=6.0", { include-group = "s3" }]

  s3 = ["aioboto3>=13.0"]

### Tools configuration
[tool.pytest.ini_options]
  addopts = ["--strict-markers"]
  asyncio_mode = "auto"
  # Match the app's INFO root level, which is set at startup, not at import.
  log_level = "INFO"
  markers = [
    "unit: pure function/service tests with no app boot unless unavoidable",
    "integration: ASGI app, route, or lifespan behavior tests",
    "slow: intentionally longer lifecycle/worker tests",
  ]
  testpaths = ["tests"]

[tool.coverage.report]
  fail_under   = 80
  show_missing = true

[tool.commitizen]
  # `just release-prep <version>` runs `cz bump --files-only` to write the version into
  # these files. CHANGELOG.md is written by hand.
  tag_format       = "v$version"
  version_files    = ["app/__version__.py", "openapi.r9cam.json:\"version\"", "CITATION.cff:^version", "codemeta.json:\"version\""]
  version_provider = "pep621"
  version_scheme   = "semver2"

[tool.mutmut]
  # The relay trust boundary and the upload queue. `just mutation` runs this from a
  # staged copy where r9cam_models sits under src/, so mutmut derives the same module
  # names the tests import.
  also_copy                          = ["scripts", "typings"]
  only_mutate                        = ["app/delivery/*", "app/relay/*", "src/r9cam_models/*"]
  # A fixed Hypothesis seed also turns off its example database, so each mutant gets the same verdict every run.
  pytest_add_cli_args                = ["-q", "-p", "no:cacheprovider", "-p", "no:codspeed", "--hypothesis-seed=0"]
  pytest_add_cli_args_test_selection = ["tests/unit", "tests/integration"]
  source_paths                       = ["app", "src/r9cam_models"]

[tool.ruff]
  fix            = true
  line-length    = 120
  target-version = "py313"

  [tool.ruff.format]
    docstring-code-format = true

  [tool.ruff.lint]
    fixable = ["ALL"]
    select  = ["ALL"]

    ignore = [
      # Prevent conflicts with formatter (see https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules)
      "ANN204", # missing-return-type-special-method
      "COM812", # missing-trailing-comma
      "COM819", # prohibited-trailing-comma
      "E111",   # indentation-with-invalid-multiple
      "E114",   # indentation-with-invalid-multiple-comment
      "E117",   # over-indented
      "Q",      # flake8-quotes
      "W191",   # tab-indentation

      # Overly strict rules
      "D105",   # undocumented-magic-method (magic methods are often self-explanatory)
      "D107",   # undocumented-public-init (__init__ methods are often self-explanatory)
      "CPY001", # missing-copyright (not relevant for this project)

    ]

    [tool.ruff.lint.flake8-bugbear]
      # Allow default arguments for FastAPI Depends and Query
      extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

    [tool.ruff.lint.flake8-type-checking]
      # Allow runtime imports for FastAPI dependency injection and Pydantic validation
      exempt-modules                 = ["app", "fastapi", "pydantic", "typing.Annotated"]
      runtime-evaluated-base-classes = ["pydantic.BaseModel"]

    [tool.ruff.lint.per-file-ignores]
      "tests/**" = ["ANN401", "PLR2004", "S101", "SLF001"]

    [tool.ruff.lint.pydocstyle]
      convention = "google"

    [tool.ruff.lint.pylint]
      allow-magic-value-types = ["int"]
      max-args                = 10

[tool.ty.environment]
  extra-paths = ["typings"]

# UV configuration
[tool.uv]
  # Mitigate supply chain issues
  exclude-newer = "3 days"

  [tool.uv.sources]
    r9cam-models = { workspace = true }

  [tool.uv.workspace]
    members = ["r9cam_models"]
