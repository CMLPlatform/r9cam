name: Publish r9cam-models

on:
  push:
    tags:
      - "r9cam-models-v*.*.*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-tag:
    name: Validate package tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15"

      - name: Verify tag matches package version
        run: python scripts/validate_models_package_tag.py "${{ github.ref_name }}"

  build:
    needs: validate-tag
    uses: ./.github/workflows/models-check-reusable.yml
    with:
      python_version: "3.13"
      upload_artifact: true

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/r9cam-models
    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: r9cam-models-dist
          path: dist/r9cam-models

      - name: Publish distribution
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist/r9cam-models
