# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: CI

# No push trigger: main only advances through a PR, so a push run repeats the
# check that already passed on the PR head. security.yml keeps its push trigger
# on purpose — a secret reaching main is exactly what a post-merge scan is for.
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Lint, types, the dependency audit and the licence check run in python.yml, and the
  # git hooks in checks.yml. This job holds what only this repo needs: the coverage gate
  # (and its Codecov upload), the openapi schema check and the fuzz harness smoke run.
  check:
    name: Coverage & fuzz smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: "3.13"
      - run: uv sync --locked --all-groups

      - name: Check the openapi schema
        run: uv run python -m scripts.export_openapi --check

      # A short fixed-seed run, so renaming a private name the harness imports
      # fails here and not only in the slow ClusterFuzzLite job.
      - name: Smoke-run the fuzz harness
        run: uv run python fuzz/relay_frames.py -runs=200 -seed=1

      - name: Run tests
        run: uv run pytest --cov=app --cov=r9cam_models --cov-report=term-missing --cov-report=xml:coverage.xml

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
