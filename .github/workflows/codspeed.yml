# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: CodSpeed

# Runs on push to main as well as on PRs: CodSpeed compares each PR against
# the latest main run, so main needs its own baseline.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    # Only what the benchmarks import or install. Docs, fuzzing and model-publishing changes
    # can't move a result.
    paths:
      - 'app/**'
      - 'r9cam_models/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - '.github/workflows/codspeed.yml'
  # Lets CodSpeed trigger backtest runs to build up initial history.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # OIDC authentication with CodSpeed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: "3.13"

      - run: uv sync --locked --no-default-groups --group test

      - name: Run benchmarks
        uses: CodSpeedHQ/action@61efe07e57e55bedeab750c434504de272a56e8c # v5.6.1
        with:
          mode: simulation
          run: uv run --no-sync pytest tests/benchmarks --codspeed
