name: Release

on:
  workflow_dispatch:

# Do not cancel in-progress releases
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # `just release-prep` made the bump commit and it reached main through a pull request,
  # so its checks already ran. This job only tags that commit and creates the release.
  release:
    name: Release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the tag and the GitHub release
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Read the version
        id: version
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check the tag is new
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          if gh api --silent "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" 2>/dev/null; then
            echo "::error::Tag $TAG already exists. Run just release-prep first and merge its pull request."
            exit 1
          fi

      # The notes are this version's CHANGELOG.md section, without its heading.
      - name: Create the tag and the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          awk -v heading="## $TAG " 'index($0, heading) == 1 { found = 1; next } found && /^## / { exit } found { print }' \
            CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md has no $TAG section. Run just release-prep first."
            exit 1
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"

  # A separate job so the OIDC token that signs the attestations is never available
  # to the job that creates the release.
  assets:
    name: Release assets
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: write # upload the assets to the GitHub release
      id-token: write # sign the attestations through Sigstore
      attestations: write # store the attestations on the repository
    timeout-minutes: 10
    env:
      TAG: v${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: "3.13"

      # The SBOM lists the locked runtime dependencies, which is what the container
      # image installs. It does not cover the Debian packages in the image.
      - name: Build the distributions and the SBOM
        run: |
          uv build --out-dir dist --clear
          uv export --format cyclonedx1.5 --preview-features sbom-export --locked --no-dev \
            --output-file dist/r9cam.cdx.json

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

      - name: Attest the SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.whl
          sbom-path: dist/r9cam.cdx.json

      - name: Upload the release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" dist/*.whl dist/*.tar.gz dist/r9cam.cdx.json --repo "$GITHUB_REPOSITORY"
