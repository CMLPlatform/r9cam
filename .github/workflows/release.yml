name: Release

# A pushed version tag (`just release-publish <version>`) starts this. It drafts the GitHub
# release from the CHANGELOG section, uploads the wheel, the sdist and the sdist's SBOM to
# the draft, pushes the arm64 container image to GHCR, and only then publishes the release,
# so a release is never public without its assets (immutable releases accept no later
# upload). If the notes check fails before the draft exists, fix CHANGELOG.md, delete the
# tag (a tags-ruleset bypass is needed) and tag again.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions: {}

# Queue, never cancel: a release gets its assets exactly once.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Publish only a tag signed with a key in .github/allowed_signers on the default
      # branch: .github/scripts/verify-tag.sh says why.
      - name: Refuse a tag not signed with an allowed key
        env:
          TAG: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/verify-tag.sh" --fetch "$TAG" "origin/$DEFAULT_BRANCH"

      # A tag pushed from a commit `release-prep` never bumped would ship distributions
      # whose version files name the previous release.
      - name: Tag matches the version files
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          [ "$TAG_NAME" = "v$version" ] || {
            echo "::error::release $TAG_NAME is on a commit at version $version; run just release-prep first"
            exit 1
          }

  # Drafts the release with the CHANGELOG section as its notes. A rerun finds the draft
  # and leaves it, so the failed jobs can be re-run.
  draft:
    name: Draft release
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the draft release
    timeout-minutes: 5
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Create the draft
        run: |
          set -euo pipefail
          version="${TAG#v}"
          python3 scripts/release_notes.py "$version" <CHANGELOG.md >"$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md has no [$version] section"
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; leaving it"
            exit 0
          fi
          gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"

  # A separate job so the OIDC token that signs the attestations is never available
  # to the version check.
  assets:
    name: Release assets
    needs: draft
    runs-on: ubuntu-24.04
    permissions:
      contents: write # upload the assets to the GitHub release
      id-token: write # sign the attestations through Sigstore
      attestations: write # store the attestations on the repository
    timeout-minutes: 10
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false # a release build never restores a cache another workflow wrote
          version: "0.13.6"
          python-version: "3.13"

      # The SBOM lists the locked runtime dependencies, which is what the container
      # image installs, and is named after the sdist it belongs to. It does not cover the
      # Debian packages in the image.
      - name: Build the distributions and the SBOM
        run: |
          uv build --out-dir dist --clear
          sdist="$(basename dist/*.tar.gz)"
          uv export --format cyclonedx1.5 --preview-features sbom-export --locked --no-dev \
            --output-file "dist/$sdist.cdx.json"

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

      - name: Attest the SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
          sbom-path: dist/*.tar.gz.cdx.json

      - name: Upload the release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" dist/*.whl dist/*.tar.gz dist/*.tar.gz.cdx.json --clobber --repo "$GITHUB_REPOSITORY"

  # The Pi pulls this image instead of building it. Built on an arm64 runner, so no QEMU.
  image:
    name: Container image
    needs: draft
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write # push the image to GHCR
      id-token: write # sign the attestations through Sigstore
      attestations: write # store the attestations on the repository
    timeout-minutes: 30
    env:
      # Deployed Pis pull this name, so never rename it.
      IMAGE: ghcr.io/cmlplatform/r9cam
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false

      # Tags 0.7.0, 0.7 and latest. A pre-release gets only its full version.
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # No cache-from: a release build never restores a cache another workflow wrote.
      # Only the labels that change per release; the Dockerfile sets the static ones.
      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile
          target: runtime # paired mode; the last stage is the standalone one
          platforms: linux/arm64
          load: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.revision'] }}
            org.opencontainers.image.created=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          build-args: GIT_SHA=${{ github.sha }}

      # Same check as container.yml: the runner has no camera, so pass only if startup
      # got as far as opening it.
      - name: Smoke-test startup
        env:
          TAG: ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          logs=$(timeout 60 docker run --rm "$TAG" 2>&1 || true)
          printf '%s\n' "$logs" | tail -n 20
          if ! grep -q CameraInitializationError <<<"$logs"; then
            echo "::error::the app stopped before it tried to open the camera"
            exit 1
          fi
          # The release image is paired mode only: the s3 group must not be in it.
          if docker run --rm --entrypoint python "$TAG" -c "import aioboto3" 2>/dev/null; then
            echo "::error::the image has aioboto3, so it was built from the standalone target"
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same inputs as the build above, so every layer comes from the builder that just
      # built it and the pushed image is the one the smoke test ran.
      - name: Push image
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile
          target: runtime # paired mode; the last stage is the standalone one
          platforms: linux/arm64
          push: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.revision'] }}
            org.opencontainers.image.created=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          build-args: GIT_SHA=${{ github.sha }}

      # Unlike the uv export in the assets job, this SBOM also lists the Debian packages.
      - name: Image SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          # The pushed digest is an index; without a platform Trivy looks for linux/amd64 in it.
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: cyclonedx
          output: r9cam-image.cdx.json
          cache: "false" # a release build never restores a cache another workflow wrote

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Attest the SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: r9cam-image.cdx.json
          push-to-registry: true

  # Last, once every asset and the image are in: publishing makes the release immutable.
  publish:
    name: Publish release
    needs: [assets, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # publish the draft
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Publish the draft
        run: gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
