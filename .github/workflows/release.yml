name: Release

# Publishing a GitHub release (drafted by `just release-publish <version>`) creates its tag
# and starts this: the wheel, the sdist and the SBOM go onto that release, and the arm64
# container image goes to GHCR.
on:
  release:
    types: [published]

permissions: {}

# Queue, never cancel: a release gets its assets exactly once.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  check:
    name: Check version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # A release published by hand from a commit `release-prep` never bumped would ship
      # distributions whose version files name the previous release.
      - name: Tag matches the version files
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          [ "$TAG_NAME" = "v$version" ] || {
            echo "::error::release $TAG_NAME is on a commit at version $version; run just release-prep first"
            exit 1
          }

  # A separate job so the OIDC token that signs the attestations is never available
  # to the version check.
  assets:
    name: Release assets
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: write # upload the assets to the GitHub release
      id-token: write # sign the attestations through Sigstore
      attestations: write # store the attestations on the repository
    timeout-minutes: 10
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false # a release build never restores a cache another workflow wrote
          version: "0.13.5"
          python-version: "3.13"

      # The SBOM lists the locked runtime dependencies, which is what the container
      # image installs. It does not cover the Debian packages in the image.
      - name: Build the distributions and the SBOM
        run: |
          uv build --out-dir dist --clear
          uv export --format cyclonedx1.5 --preview-features sbom-export --locked --no-dev \
            --output-file dist/r9cam.cdx.json

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

      - name: Attest the SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.whl
          sbom-path: dist/r9cam.cdx.json

      - name: Upload the release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" dist/*.whl dist/*.tar.gz dist/r9cam.cdx.json --repo "$GITHUB_REPOSITORY"

  # The Pi pulls this image instead of building it. Built on an arm64 runner, so no QEMU.
  image:
    name: Container image
    needs: check
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write # push the image to GHCR
      id-token: write # sign the attestations through Sigstore
      attestations: write # store the attestations on the repository
    timeout-minutes: 30
    env:
      # Deployed Pis pull this name, so never rename it.
      IMAGE: ghcr.io/cmlplatform/r9cam
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      # Tags 0.7.0, 0.7 and latest. A pre-release gets only its full version.
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      # No cache-from: a release build never restores a cache another workflow wrote.
      # Only the labels that change per release; the Dockerfile sets the static ones.
      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          load: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.revision'] }}
            org.opencontainers.image.created=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}

      # Same check as container.yml: the runner has no camera, so pass only if startup
      # got as far as opening it.
      - name: Smoke-test startup
        env:
          TAG: ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          logs=$(timeout 60 docker run --rm "$TAG" 2>&1 || true)
          printf '%s\n' "$logs" | tail -n 20
          if ! grep -q CameraInitializationError <<<"$logs"; then
            echo "::error::the app stopped before it tried to open the camera"
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same inputs as the build above, so every layer comes from the builder that just
      # built it and the pushed image is the one the smoke test ran.
      - name: Push image
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.revision'] }}
            org.opencontainers.image.created=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}

      # Unlike the uv export in the assets job, this SBOM also lists the Debian packages.
      - name: Image SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: cyclonedx
          output: r9cam-image.cdx.json
          cache: "false" # a release build never restores a cache another workflow wrote

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Attest the SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: r9cam-image.cdx.json
          push-to-registry: true
