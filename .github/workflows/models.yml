# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# Gated by workflow-level `paths:` rather than a `changes` job — GitHub evaluates
# these for free, where a paths-filter job costs a whole hosted runner.
# `pyproject.toml`/`uv.lock` are included because the models wheel is built and
# resolved against the root workspace lock, not just its own subpackage manifest.

name: Models

on:
  push:
    branches: [ main ]
    paths:
      - 'r9cam_models/**'
      - 'tests/unit/core/test_contract_package.py'
      - 'scripts/check_models_release.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/models.yml'
      - '.github/workflows/models-check-reusable.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'r9cam_models/**'
      - 'tests/unit/core/test_contract_package.py'
      - 'scripts/check_models_release.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/models.yml'
      - '.github/workflows/models-check-reusable.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  models-check:
    uses: ./.github/workflows/models-check-reusable.yml
    with:
      python_version: "3.13"

  # Main only: a version bump is tagged after it merges, so a PR run would always fail.
  release-drift:
    name: Models version vs PyPI
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # the check looks for the release tag locally
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15"

      - name: Check the workspace version is published or tagged
        run: python scripts/check_models_release.py
