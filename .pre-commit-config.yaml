# Run with prek, a drop-in pre-commit replacement: prek install && prek run -a
#
# The README says how to install prek. Revs are commit SHAs, since tags are
# mutable; the dependency bot moves each SHA and its `# frozen:` tag together.

# `prek install` sets up each of these: the commit message is checked as you commit.
default_install_hook_types: [pre-commit, commit-msg]

# data/ and tests/fixtures/ hold inputs and test cases: the whitespace, end-of-file
# and notebook hooks must not rewrite them. Excluded per hook, so the secret scan
# and the large-file check still cover them.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
        exclude: ^app/static/vendor/ # vendored hls.js is 531 KB
      - id: check-merge-conflict
      - id: check-yaml
      - id: end-of-file-fixer
        exclude: ^(data|tests/fixtures)/
      - id: mixed-line-ending
        exclude: ^(data|tests/fixtures)/
      - id: trailing-whitespace
        exclude: ^(data|tests/fixtures)/
      # Not gated to python: .rumdl.toml ships to every stack.
      - id: check-toml

  # Commit messages follow committed.toml: Conventional Commits, imperative, no period.
  - repo: https://github.com/crate-ci/committed
    rev: 02af07ed1d11ad69a96ab75f08c9831a4e2c00da # frozen: v1.1.12
    hooks:
      - id: committed
        # git writes a merge commit's message itself, so skip the check during a merge.
        entry: sh -c 'test -f "$(git rev-parse --git-path MERGE_HEAD)" || exec committed "$@"' --

  # Refuse an unsigned commit before the dco workflow sees it: that checks fork pull requests,
  # and every pull request with level=community. Merge commits are skipped, as there.
  - repo: local
    hooks:
      - id: dco-signoff
        name: commit message has a Signed-off-by line (git commit -s)
        entry: sh -c 'test -f "$(git rev-parse --git-path MERGE_HEAD)" || grep -qE "^Signed-off-by:[ ].+ <[^>]+>[[:space:]]*$" "$1"' --
        language: system
        stages: [commit-msg]

  # Every file has a copyright and license, from REUSE.toml or its own header.
  - repo: https://github.com/fsfe/reuse-tool
    rev: a1bb792acda6fd0724936b4ebbdbc8eceb9c0459 # frozen: v6.2.0
    hooks:
      - id: reuse

  # Not gated to ts: .vscode/ and .github/rulesets/ JSON ship to every stack.
  # .json files are read as JSON5, so comments and trailing commas in tsconfig
  # and VS Code settings pass; syntax errors and duplicate keys fail.
  - repo: https://github.com/simonvanlierde/jsonvet
    rev: 022d320d5b971eccb28cfa6ce205152cbb382e53 # frozen: v3.2.0
    hooks:
      - id: jsonvet

  # The citation files and package manifests must agree (CITATION.cff is the source).
  - repo: https://github.com/simonvanlierde/citesync
    rev: 27c649e635302721583fd9a043865bfb98116225 # frozen: v0.4.0
    hooks:
      - id: citesync

  # Keeps uv.lock in step with pyproject.toml.
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: b9d5257d60a86c20fd9a3919d548e08ba5ab905b # frozen: 0.13.8
    hooks:
      - id: uv-lock

  # Formats first, so yamllint below sees the formatted file.
  - repo: https://github.com/google/yamlfmt
    rev: 21ca5323a9c87ee37a434e0ca908efc0a89daa07 # frozen: v0.21.0
    hooks:
      - id: yamlfmt

  - repo: https://github.com/adrienverge/yamllint
    rev: cba56bcde1fdd01c1deb3f945e69764c291a6530 # frozen: v1.38.0
    hooks:
      - id: yamllint

  # Workflow scripts need their own check; jactionlint checks only inline run blocks.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: a6564f5d57444e123433a5c9af733e3975c77229 # frozen: v0.11.0.1-1
    hooks:
      - id: shellcheck

  # gitleaks' successor from the same authors. gitleaks takes security fixes only.
  - repo: https://github.com/betterleaks/betterleaks
    rev: 39d5bdcf34db54e944facac5cf6e8b03db5e2b99 # frozen: v1.10.1
    hooks:
      - id: betterleaks

  # Audits .github/ for template injection, credential leakage, cache poisoning
  # and impostor commits. Set GH_TOKEN to enable the audits that need the API;
  # without it only the offline subset runs.
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: c92afdf2c6ca336aaa8f39e2bd8d48f62dbd8e1f # frozen: v1.31.1
    hooks:
      - id: zizmor

  # Checks what zizmor doesn't: unknown keys, bad `needs`, expression type errors,
  # and shellcheck over every `run:` when shellcheck is on PATH. jactionlint is a
  # maintained fork of actionlint that adds release, cache and concurrency checks.
  - repo: https://github.com/jdx/jactionlint
    rev: a65ab044e916760429068fe5794b8306abdfcbb9 # frozen: v2.3.0
    hooks:
      - id: jactionlint

  - repo: https://github.com/kynan/nbstripout
    rev: 34071b78c181af3bf5af955c1426466e096fc3db # frozen: 0.9.1
    hooks:
      - id: nbstripout
        exclude: ^(data|tests/fixtures)/

  # Scientific Python's repo-review: packaging, pytest and CI config against their
  # development guide. Checks this project skips on purpose are listed, each with its
  # reason, under [tool.repo-review.ignore] in pyproject.toml.
  - repo: https://github.com/scientific-python/cookie
    rev: 1589a99867d6cac494ac7545fe6a83108580a3ee # frozen: 2026.08.14
    hooks:
      - id: sp-repo-review
        # Upstream leaves repo-review unpinned.
        additional_dependencies: ["repo-review[cli]==1.3.0"]
  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: df5a947a3af0dba56640e644c6b9316184749168 # frozen: v0.3.4
    hooks:
      - id: rumdl
        args: [--fix]

  # Misspelt words in code, comments and docs. It fixes the ones it is sure of and
  # fails, so you review the fix. List a word it must leave alone in _typos.toml.
  - repo: https://github.com/crate-ci/typos
    rev: 7f9d0819ca1c008ade73f4b41fa9d258d48f605b # frozen: v1.51.1
    hooks:
      - id: typos
        # Copier writes the template's commit id here, and a hex id can spell a word
        # typos rejects. typos knows English only, so it would rewrite valid words in
        # translation catalogs: gettext .po files and anything in a locales/ directory.
        # List other files with text in other languages under [files] extend-exclude in
        # _typos.toml.
        exclude: ^\.copier-answers\.yml$|\.po$|(^|/)locales/

  # Dead relative links in Markdown and HTML. Offline, so a commit never waits on the
  # network: the weekly links.yml checks the web links. lychee's own hook installs its
  # binary with an unpinned install script, so this takes upstream's wheel from PyPI
  # at an exact version instead.
  - repo: local
    hooks:
      - id: lychee
        name: lychee --offline
        entry: lychee --no-progress --offline --exclude '%7B%7B'
        language: python
        additional_dependencies: [lychee-bin==0.24.2]
        types_or: [markdown, html]
        require_serial: true

  - repo: local
    hooks:
      # Runs from the project's venv, not the ruff-pre-commit mirror, so it uses the
      # same ruff as CI. --force-exclude keeps ruff's excludes when the hook passes
      # explicit filenames. A local hook running from the project's venv (`uv run ...`)
      # must join the SKIP list in .github/workflows/checks.yml, whose hooks job has no uv.
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true

      - id: ty
        name: ty check
        entry: uv run --frozen ty check
        language: system
        pass_filenames: false
        types: [python]

      # Keeps app/ and openapi.r9cam.json in step. Local like ty, so it joins the SKIP
      # list in .github/workflows/checks.yml and runs in ci.yml.
      - id: openapi-schema-check
        name: openapi schema check
        entry: uv run --frozen python -m scripts.export_openapi --check
        language: system
        files: ^(?:app/.*|scripts/export_openapi\.py|openapi\.r9cam\.json|justfile|just/.*|pyproject\.toml|uv\.lock)$
        pass_filenames: false
